# NeMo Guardrails config for Ask Northbridge (Lecture 6): one input rail (self check input), Claude Haiku as the checker.
# Run with NEMOGUARDRAILS_LLM_FRAMEWORK=langchain and langchain-anthropic installed (research/TOOLS_RESEARCH.md §3.3).
models:
  - type: main
    engine: anthropic
    model: claude-haiku-5-5
rails:
  input:
    flows:
      - self check input
  output:
    flows:
      - self check output
