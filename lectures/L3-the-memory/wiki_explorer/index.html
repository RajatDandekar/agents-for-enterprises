<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbridge Wiki Explorer</title>
<style>
:root {
  --bg: #ffffff; --panel: #f8f9fa; --ink: #202122; --muted: #54595d; --line: #a2a9b1; --soft: #eaecf0;
  --link: #3366cc; --visited: #795cb2; --red: #d73333; --hl: #fef6e7; --hl-line: #fc3; --ok: #14866d;
  --warn: #ac6600; --chain: #36c; --chain-bg: #eaf3ff; --serif: "Linux Libertine", "Georgia", "Times", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101418; --panel: #1b2026; --ink: #eaecf0; --muted: #a2a9b1; --line: #54595d; --soft: #27292d;
  --link: #88a3e8; --visited: #a799cd; --red: #fd7865; --hl: #3a3220; --hl-line: #c90; --ok: #4ab89c;
  --warn: #e0a040; --chain: #88a3e8; --chain-bg: #1c2a40; } }
:root[data-theme="dark"] {
  --bg: #101418; --panel: #1b2026; --ink: #eaecf0; --muted: #a2a9b1; --line: #54595d; --soft: #27292d;
  --link: #88a3e8; --visited: #a799cd; --red: #fd7865; --hl: #3a3220; --hl-line: #c90; --ok: #4ab89c;
  --warn: #e0a040; --chain: #88a3e8; --chain-bg: #1c2a40; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; }
a { color: var(--link); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
a.red { color: var(--red); }
header.top { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--soft);
  position: sticky; top: 0; background: var(--bg); z-index: 5; flex-wrap: wrap; }
.logo { font-family: var(--serif); font-size: 20px; white-space: nowrap; }
.logo small { display: block; font-family: var(--sans); font-size: 11px; color: var(--muted); }
#q { flex: 1; min-width: 160px; max-width: 420px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 2px;
  background: var(--bg); color: var(--ink); font-size: 14px; }
.tabs { display: flex; gap: 2px; }
.tabs a { padding: 6px 10px; font-size: 13px; border-bottom: 2px solid transparent; color: var(--ink); }
.tabs a.on { border-bottom-color: var(--link); color: var(--link); }
.wrap { display: grid; grid-template-columns: 210px 1fr; min-height: calc(100vh - 54px); }
nav.side { padding: 12px 10px 40px 16px; font-size: 13px; border-right: 1px solid var(--soft); overflow: auto;
  max-height: calc(100vh - 54px); position: sticky; top: 54px; }
nav.side h4 { margin: 14px 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase;
  letter-spacing: .04em; }
nav.side a { display: block; padding: 2px 0; }
nav.side .cnt { color: var(--muted); font-size: 11px; }
main { padding: 16px 28px 60px; max-width: 1100px; min-width: 0; }
h1.title { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 0 0 2px; border-bottom: 1px solid var(--line);
  padding-bottom: 4px; }
.tagline { font-size: 12px; color: var(--muted); margin: 4px 0 14px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 2px; margin-left: 6px;
  border: 1px solid var(--line); color: var(--muted); vertical-align: middle; }
.badge.sup { color: var(--warn); border-color: var(--warn); }
.badge.hr { color: var(--red); border-color: var(--red); }
.article h2 { font-family: var(--serif); font-weight: 400; font-size: 21px; border-bottom: 1px solid var(--line);
  margin: 22px 0 8px; padding-bottom: 2px; }
.article h3 { font-size: 16px; margin: 16px 0 6px; }
.article p, .article li { line-height: 1.6; }
.article table.md { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
.article table.md td, .article table.md th { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; }
.article table.md th { background: var(--panel); }
.article code { background: var(--panel); padding: 0 3px; border-radius: 2px; font-size: 13px; }
.infobox { float: right; clear: right; width: 290px; margin: 0 0 14px 18px; border: 1px solid var(--line);
  background: var(--panel); font-size: 13px; padding: 6px; }
.infobox .ib-title { text-align: center; font-weight: 600; padding: 4px; font-size: 14px; }
.infobox table { width: 100%; border-collapse: collapse; }
.infobox th { text-align: left; vertical-align: top; padding: 3px 4px; width: 42%; }
.infobox td { padding: 3px 4px; word-break: break-word; }
.toc { display: inline-block; border: 1px solid var(--line); background: var(--panel); padding: 8px 14px 8px 10px;
  font-size: 13px; margin: 8px 0 6px; }
.toc b { display: block; text-align: center; margin-bottom: 4px; }
.toc ol { margin: 0; padding-left: 20px; }
sup.ref a { font-size: 11px; }
ol.refs { font-size: 13px; padding-left: 26px; }
ol.refs li { margin: 3px 0; }
ol.refs li:target, .flash { background: var(--hl); }
.q { color: var(--muted); font-style: italic; }
.ok { color: var(--ok); }
.meta-box { border: 1px solid var(--soft); background: var(--panel); padding: 8px 12px; font-size: 13px; margin: 16px 0; }
.meta-box h4 { margin: 0 0 6px; font-size: 13px; }
.hist li { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.index-list li { margin: 2px 0; }
.chain-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0 12px; }
.step { border: 1px solid var(--line); border-radius: 14px; padding: 3px 10px; font-size: 12px; background: var(--bg);
  cursor: pointer; color: var(--ink); }
.step.on { background: var(--chain); color: #fff; border-color: var(--chain); }
.step .k { font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: .05em; margin-right: 4px; }
.arrow { color: var(--muted); }
.chain-panel { border: 1px solid var(--chain); background: var(--chain-bg); padding: 10px 14px; margin-bottom: 14px;
  font-size: 13px; position: sticky; top: 54px; z-index: 4; }
.chain-panel .num { font-variant-numeric: tabular-nums; }
.chosen { background: var(--hl); outline: 2px solid var(--hl-line); }
.src-box { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--panel);
  border: 1px solid var(--soft); padding: 10px; max-height: 420px; overflow: auto; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 10px; font-size: 13px;
  border-radius: 2px; cursor: pointer; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px 18px; }
.answer { border-left: 3px solid var(--ok); padding: 6px 12px; background: var(--panel); white-space: pre-wrap; }
.small { font-size: 12px; color: var(--muted); }
@media (max-width: 760px) {
  .wrap { grid-template-columns: 1fr; }
  nav.side { position: static; max-height: 150px; border-right: 0; border-bottom: 1px solid var(--soft); }
  .chain-panel { position: static; }
  .infobox { float: none; width: 100%; margin: 0 0 12px; }
  main { padding: 12px 16px 40px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="logo">Northbridge Wiki<small>compiled by an LLM from 699 raw files</small></div>
  <input id="q" type="search" placeholder="Search page titles and codes" autocomplete="off">
  <div class="tabs" id="tabs">
    <a data-r="#/index">Index</a><a data-r="#/chains">Query chains</a><a data-r="#/log">log.md</a><a data-r="#/about">About</a>
  </div>
</header>
<div class="wrap">
  <nav class="side" id="side"></nav>
  <main id="main"><p>Loading…</p></main>
</div>
<script>
const S = { pages: {}, order: [], chains: {}, log: [], stats: {}, sources: {} };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TYPE_NAMES = { policy: "Policies", procedure: "Procedures", topic: "Topics", decision: "Decisions", manual: "Manuals",
  release: "Releases", screen: "Screens", "service-group": "Service groups", error: "Error codes", "error-list": "Error lists",
  supplier: "Suppliers", "item-family": "Item families", person: "People", role: "Roles", "cost-centre": "Cost centres",
  "data-source": "Data sources", answer: "Filed answers" };

async function load() {
  const [w, c, l] = await Promise.all(["data/catalog.json", "data/chains.json", "data/log.json"].map(u =>
    fetch(u).then(r => r.ok ? r.json() : null).catch(() => null)));
  if (!w) { $("#main").innerHTML = "<p>data/catalog.json not found.</p>"; return; }
  S.pages = w.pages; S.stats = w.stats || {}; S.order = Object.keys(w.pages).sort(); S.lists = w.lists || {}; S.indexMd = w.index_md || "";
  S.chains = (c && c.chains) || {}; S.log = (l && l.lines) || []; S.update = c && c.update; S.lint = c && c.lint;
  side(); route();
}

function side(filter = "") {
  const f = filter.trim().toLowerCase();
  const byType = {};
  for (const s of S.order) {
    const p = S.pages[s];
    if (f && !(s.includes(f) || p.title.toLowerCase().includes(f) || (p.summary || "").toLowerCase().includes(f))) continue;
    (byType[p.type] = byType[p.type] || []).push(s);
  }
  let h = "";
  if (!f) {
    h += `<h4>Navigation</h4><a href="#/index">Index (index.md)</a><a href="#/chains">Query chains</a><a href="#/log">History (log.md)</a>`;
    h += `<h4>Categories</h4>` + Object.keys(TYPE_NAMES).filter(t => byType[t]).map(t =>
      `<a href="#/cat/${t}">${TYPE_NAMES[t]} <span class="cnt">${byType[t].length}</span></a>`).join("");
  } else {
    const hits = Object.values(byType).flat().slice(0, 80);
    h += `<h4>${hits.length} matching pages</h4>` + hits.map(s => `<a href="#/page/${s}">${esc(S.pages[s].title)}</a>`).join("");
  }
  $("#side").innerHTML = h;
}

// ---------------------------------------------------------------- markdown (the subset the wiki uses)
function inline(t, slug) {
  t = esc(t);
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  t = t.replace(/\[\[([a-z0-9][a-z0-9-]*)(#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (m, s, h, txt) => {
    const p = S.pages[s] || (S.lists && S.lists[s] ? { title: s } : null);
    const label = txt || (p ? p.title : s);
    return p ? `<a href="#/page/${s}" data-link="${s}" title="${esc(p.title)}">${label}</a>`
      : (s.startsWith("hr-") ? `<span class="badge hr" title="restricted to HR">restricted</span>`
        : `<a class="red" title="page does not exist (red link)">${label}</a>`);
  });
  t = t.replace(/\[\^(r\d+)\]/g, (m, k) => { const n = (S.cur.refNum[k]); return n ? `<sup class="ref"><a href="#ref-${k}" onclick="flash('ref-${k}');return false">[${n}]</a></sup>` : ""; });
  return t;
}
function md(body, slug) {
  const lines = body.split("\n"); let out = [], i = 0, toc = [];
  while (i < lines.length) {
    let ln = lines[i];
    if (/^##\s+References/.test(ln)) break;
    let m;
    if ((m = ln.match(/^(#{2,4})\s+(.*)$/))) {
      const lvl = m[1].length, id = "s-" + toc.length;
      if (lvl <= 3) toc.push({ lvl, text: m[2], id });
      out.push(`<h${lvl} id="${id}">${inline(m[2], slug)}</h${lvl}>`); i++; continue;
    }
    if (/^\|/.test(ln)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.replace(/\[\[([^\]|]+)\|([^\]]*)\]\]/g, "[[$1\u0001$2]]").replace(/^\||\|$/g, "").split("|").map(c => c.trim().replace(/\u0001/g, "|"));
      const body = rows.filter(r => !/^\|\s*-{2,}/.test(r) && !/^\|[\s|:-]+\|$/.test(r));
      out.push(`<table class="md">` + body.map((r, k) => `<tr>${cells(r).map(c => k === 0 && rows.length > 2 && /^\|[\s|:-]+\|$/.test(rows[1]) ? `<th>${inline(c, slug)}</th>` : `<td>${inline(c, slug)}</td>`).join("")}</tr>`).join("") + `</table>`);
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(ln)) {
      const ordered = /^\s*\d+\./.test(ln); const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, "")); i++; }
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x, slug)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    if (!ln.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^(#{2,4}\s|\||\s*([-*]|\d+\.)\s)/.test(lines[i])) { para.push(lines[i]); i++; }
    out.push(`<p>${inline(para.join(" "), slug)}</p>`);
  }
  return { html: out.join("\n"), toc };
}
function flash(id) { const e = document.getElementById(id); if (!e) return; e.scrollIntoView({ block: "center" }); e.classList.add("flash"); setTimeout(() => e.classList.remove("flash"), 1600); }

// ---------------------------------------------------------------- views
function listView(slug, hl) {
  S.cur = { slug, refNum: {} };
  const t = S.lists[slug] || "";
  const title = (t.match(/^# (.*)$/m) || [, slug])[1];
  setTimeout(() => { if (hl) hl.forEach(s => document.querySelectorAll(`[data-link="${s}"]`).forEach(a => a.classList.add("chosen"))); }, 0);
  return `<h1 class="title">${esc(title)}</h1><div class="tagline">lists/${esc(slug)}.md: a "List of ..." page that index.md points to</div><div class="article">${md(t.replace(/^# .*$/m, ""), slug).html}</div>`;
}

function pageView(slug, hl) {
  if (S.lists && S.lists[slug]) return listView(slug, hl);
  const p = S.pages[slug];
  if (!p) return `<h1 class="title">${esc(slug)}</h1><p>This page does not exist in the wiki (a red link).</p>`;
  if (p.restricted) return `<h1 class="title">${esc(p.title)}<span class="badge hr">HR only</span></h1>
    <p class="tagline">Restricted page</p><p>This page is compiled from <code>01_policies/HR/CONFIDENTIAL/</code> and is only listed in
    <code>restricted/index.md</code>. Its content is not shown here, as AGENTS.md §7 requires.</p>`;
  S.cur = { slug, refNum: {} };
  (p.refs_order || []).forEach((k, n) => S.cur.refNum[k] = n + 1);
  const { html, toc } = md(p.body, slug);
  const badges = (p.status === "superseded" ? `<span class="badge sup">superseded sources</span>` : p.status === "future" ? `<span class="badge sup">not yet in force</span>` : p.status === "mixed" ? `<span class="badge sup">versions differ</span>` : "");
  const ib = p.infobox && Object.keys(p.infobox).length ? `<div class="infobox"><div class="ib-title">${esc(p.title)}</div><table>${Object.entries(p.infobox).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${inline(String(v), slug)}</td></tr>`).join("")}<tr><th>Type</th><td>${esc(p.type)}</td></tr></table></div>` : "";
  const tocH = toc.length >= 3 ? `<div class="toc"><b>Contents</b><ol>${toc.filter(t => t.lvl === 2).map(t => `<li><a onclick="flash('${t.id}')">${esc(t.text)}</a></li>`).join("")}</ol></div>` : "";
  const firstH = html.indexOf("<h2");
  let lead = firstH > 0 ? html.slice(0, firstH) : html; const rest = firstH > 0 ? html.slice(firstH) : "";
  if (ib) lead = lead.replace(/<table class="md">[\s\S]*?<\/table>/, "");  // the model sometimes repeats the infobox as a table
  const refs = (p.refs_order || []).map(k => { const r = p.refs[k] || {};
    return `<li id="ref-${k}">${esc(r.file)}, ${esc(r.loc_text || "")}${r.verified ? ` <span class="ok" title="the quoted words were found at this location">&#10003;</span>` : ""}${r.quote ? `<br><span class="q">“${esc(r.quote)}”</span>` : ""}${r.status && r.status !== "current" ? ` <span class="badge sup">${esc(r.status)}</span>` : ""}</li>`; }).join("");
  const inbound = (p.inbound || []).map(s => `<a href="#/page/${s}">${esc(S.pages[s] ? S.pages[s].title : s)}</a>`).join(" · ") || "<i>no page links here (an orphan)</i>";
  const hist = (p.history || []).map(h => `<li>${esc(h)}</li>`).join("");
  const conf = (p.conflicts || []).length ? `<div class="meta-box"><h4>Conflicts recorded at ingest (${p.conflicts.length})</h4><ul>${p.conflicts.map(c => `<li><b>${esc(c.kind)}</b>: today ${esc(c.today)}; other: ${esc(c.other)}</li>`).join("")}</ul></div>` : "";
  setTimeout(() => { if (hl) hl.forEach(s => document.querySelectorAll(`[data-link="${s}"]`).forEach(a => a.classList.add("chosen"))); }, 0);
  return `<h1 class="title">${esc(p.title)}${badges}</h1>
    <div class="tagline">From Northbridge's wiki · <code>pages/${esc(slug)}.md</code> · ${esc(p.type)} · updated ${esc(p.updated || "")}</div>
    <div class="article">${ib}${lead}${tocH}${rest}
    <h2>References</h2><ol class="refs">${refs}</ol></div>
    ${conf}
    <div class="meta-box"><h4>What links here (${(p.inbound || []).length})</h4>${inbound}</div>
    <div class="meta-box"><h4>Raw sources (${(p.sources || []).length})</h4><div class="small">${(p.sources || []).map(esc).join("<br>")}</div></div>
    <div class="meta-box hist"><h4>History (from log.md)</h4><ul>${hist}</ul></div>`;
}

function indexView(hlPages) {
  if (S.indexMd) {
    S.cur = { slug: "index", refNum: {} };
    const st = S.stats;
    const h = md(S.indexMd.replace(/^# .*$/m, ""), "index").html;
    setTimeout(() => { (hlPages || []).forEach(s => document.querySelectorAll(`[data-link="${s}"]`).forEach(a => { a.closest("li") ? a.closest("li").classList.add("chosen") : a.classList.add("chosen"); }));
      const e = document.querySelector(".chosen"); if (e) e.scrollIntoView({ block: "center" }); }, 30);
    return `<h1 class="title">index.md</h1><div class="tagline">The catalogue every query reads first. ${st.pages ? `${st.pages} pages · ${st.links} links · ${st.references} references to raw sources` : ""}</div><div class="article index-list">${h}</div>`;
  }
  const by = {};
  for (const s of S.order) { const p = S.pages[s]; if (p.restricted) continue; (by[p.type] = by[p.type] || []).push(s); }
  const st = S.stats;
  let h = `<h1 class="title">index.md</h1><div class="tagline">The catalogue every query reads first: one line per page, grouped by type.
    ${st.pages ? `${st.pages} pages · ${st.links} links · ${st.references} references to raw sources` : ""}</div><div class="article">`;
  for (const t of Object.keys(TYPE_NAMES)) {
    if (!by[t]) continue;
    h += `<h2 id="t-${t}">${TYPE_NAMES[t]} (${by[t].length})</h2><ul class="index-list">` + by[t].map(s =>
      `<li class="${hlPages && hlPages.includes(s) ? "chosen" : ""}" id="ix-${s}"><a href="#/page/${s}">[[${s}]]</a> ${esc(S.pages[s].title)}: <span class="small">${esc(S.pages[s].summary || "")}</span></li>`).join("") + `</ul>`;
  }
  if (hlPages && hlPages.length) setTimeout(() => { const e = document.getElementById("ix-" + hlPages[0]); if (e) e.scrollIntoView({ block: "center" }); }, 30);
  return h + "</div>";
}

function catView(t) {
  const list = S.order.filter(s => S.pages[s].type === t);
  return `<h1 class="title">Category: ${esc(TYPE_NAMES[t] || t)}</h1><div class="tagline">${list.length} pages</div>
    <div class="grid2">${list.map(s => `<div><a href="#/page/${s}">${esc(S.pages[s].title)}</a><div class="small">${esc(S.pages[s].summary || "")}</div></div>`).join("")}</div>`;
}

function logView() {
  return `<h1 class="title">log.md</h1><div class="tagline">Append-only: one line per ingest, build, lint and file-back, oldest first (${S.log.length} lines).</div>
    <ul class="hist">${S.log.map(l => `<li>${esc(l)}</li>`).join("")}</ul>`;
}

function aboutView() {
  const st = S.stats;
  return `<h1 class="title">About this wiki</h1><div class="article">
  <p>Karpathy's <b>LLM Wiki</b> pattern (gist, 4 April 2026): <b>raw sources</b> stay immutable, an LLM compiles them into
  <b>wiki pages</b> it owns (summaries, entity pages, comparisons), and a <b>schema</b> file (AGENTS.md) tells it how.
  Three operations: <b>ingest</b>, <b>query</b> (which can file good answers back) and <b>lint</b>.
  "Obsidian is the IDE, the LLM is the programmer, the wiki is the codebase."</p>
  <p>This is Northbridge Cycles' wiki, compiled by google/gemini-3.8-flash from the 699-file northbridge-docs dump
  (everything fictional).</p>
  ${st.pages ? `<table class="md"><tr><th>Pages</th><td>${st.pages}</td></tr><tr><th>Links</th><td>${st.links}</td></tr>
  <tr><th>References to raw sources</th><td>${st.references}</td></tr><tr><th>Facts extracted at ingest</th><td>${st.facts}</td></tr>
  <tr><th>Build</th><td>${esc(st.build || "")}</td></tr></table>` : ""}
  <p class="small">Open a page: <code>#/page/&lt;slug&gt;</code>. Replay a chain: <code>#/chain/Q-EMMA</code> or <code>#/chain/Q-EMMA/2</code>.</p></div>`;
}

function chainsView() {
  const ids = Object.keys(S.chains);
  return `<h1 class="title">Query chains</h1><div class="tagline">How a question is answered by navigation: index → page → link → source → answer.
    Every step is one recorded LLM call (tokens, seconds) or one file read.</div>
    <div class="grid2">${ids.map(id => { const c = S.chains[id]; return `<div><a href="#/chain/${id}">${esc(id)}</a> <span class="small">${esc(c.kind || "")}</span><div class="small">${esc(c.question)}</div></div>`; }).join("")}</div>
    ${S.update ? `<div class="meta-box"><h4>Update: one new source</h4><code>${esc(S.update.files.join(", "))}</code> touched ${S.update.updated.length + S.update.created.length} pages
      (updated: ${S.update.updated.map(s => `<a href="#/page/${s}">${esc(s)}</a>`).join(", ")}; created: ${S.update.created.map(esc).join(", ")})
      in ${S.update.seconds.total} s, ${S.update.calls} LLM calls, $${S.update.usd.toFixed(3)}. <span class="small">(The explorer shows the wiki before this update.)</span></div>` : ""}
    ${S.lint ? `<div class="meta-box"><h4>Lint: ${S.lint.n_findings} findings; ${S.lint.found} of the ${S.lint.n} planted problems found (${S.lint.found_strict} under the same label)</h4>
      <table class="md"><tr><th>Item</th><th>Kind</th><th>Found</th><th>Planted problem</th></tr>${S.lint.items.map(r => `<tr><td>${r.id}</td><td>${esc(r.kind)}</td><td>${r.found ? '<span class="ok">yes</span>' : (r.labels.length ? "as " + esc(r.labels.join("/")) : "missed")}</td><td class="small">${esc(r.what)}</td></tr>`).join("")}</table></div>` : ""}`;
}

function chainView(id, k) {
  const c = S.chains[id];
  if (!c) return `<p>No chain ${esc(id)}.</p>`;
  const steps = c.steps; k = Math.max(0, Math.min(k, steps.length - 1));
  const st = steps[k];
  const bar = steps.map((s, i) => `${i ? '<span class="arrow">→</span>' : ""}<span class="step ${i === k ? "on" : ""}" onclick="location.hash='#/chain/${id}/${i}'"><span class="k">${esc(s.kind)}</span>${esc(s.label)}</span>`).join("");
  const nums = c.totals ? `<span class="num">${c.totals.llm_calls} LLM calls · ${c.totals.tokens_in.toLocaleString()} tokens in · ${c.totals.tokens_out.toLocaleString()} out · ${c.totals.seconds}s to answer</span>` : "";
  let panel = `<div class="chain-panel"><b>${esc(id)}</b>: ${esc(c.question)}<br>${nums}${c.note ? `<div class="small">${esc(c.note)}</div>` : ""}<div class="chain-bar">${bar}</div>
    <div>Step ${k + 1} of ${steps.length}: <b>${esc(st.kind)}</b> ${esc(st.detail || "")}
    ${st.tokens_in != null ? `<span class="num small"> · call ${st.call}: ${st.tokens_in.toLocaleString()} tokens in, ${st.tokens_out} out, ${st.seconds}s</span>` : ""}</div>
    <div style="margin-top:6px"><button class="btn" onclick="location.hash='#/chain/${id}/${k - 1}'" ${k ? "" : "disabled"}>◀ Back</button>
    <button class="btn" onclick="location.hash='#/chain/${id}/${k + 1}'" ${k < steps.length - 1 ? "" : "disabled"}>Next ▶</button></div></div>`;
  let body = "";
  if (st.kind === "index") body = indexView(st.chose || []);
  else if (st.kind === "search") body = `<h1 class="title">Search over wiki sections</h1><div class="tagline">BM25 + bge-small, fused with RRF, no LLM call (${esc(st.ms ?? "")} ms)</div><ol>${(st.sections || []).map(s => `<li><a href="#/page/${s.split(" > ")[0]}">${esc(s)}</a></li>`).join("")}</ol>`;
  else if (st.kind === "page" || st.kind === "link" || st.kind === "list") body = pageView(st.page, st.next_links || []);
  else if (st.kind === "done") body = `<h1 class="title">The navigator stops</h1><div class="tagline">call ${esc(st.call)}: it has read enough</div><p>${esc(st.detail)}</p>`;
  else if (st.kind === "denied" || st.kind === "missing") body = `<h1 class="title">${st.kind === "denied" ? "Access denied" : "No such page"}</h1><p>${esc(st.label)}: ${esc(st.detail)}</p>`;
  else if (st.kind === "source") body = `<h1 class="title">Raw source</h1><div class="tagline">${esc(st.file)} ${esc(st.loc || "")}</div><div class="src-box">${esc(st.excerpt || "(excerpt not recorded)")}</div>`;
  else if (st.kind === "answer") body = `<h1 class="title">Answer</h1><div class="tagline">The shared answer step (same model and prompt as RAG) over what navigation opened</div>
    <div class="answer">${esc(c.answer)}</div><h3>Sources the answer cites</h3><ol>${(c.cited || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol>
    ${c.fact ? `<p class="small">Exact-fact check: ${c.fact.ok ? '<span class="ok">all required facts present</span>' : "missing " + esc((c.fact.missing || []).join(", "))}</p>` : ""}`;
  return panel + body;
}

const LOADED = {};
async function ensurePage(slug) {
  if (!slug || LOADED[slug] || !S.pages[slug] || S.pages[slug].restricted) return;
  const r = await fetch(`data/pages/${encodeURIComponent(slug)}.json`).catch(() => null);
  if (r && r.ok) { S.pages[slug] = await r.json(); LOADED[slug] = true; }
}
async function route() {
  const h = location.hash || "#/index";
  const parts = h.slice(2).split("/");
  if (parts[0] === "page") await ensurePage(decodeURIComponent(parts[1]));
  if (parts[0] === "chain" && S.chains[decodeURIComponent(parts[1])]) {
    const st = S.chains[decodeURIComponent(parts[1])].steps[parseInt(parts[2] || "0", 10)];
    if (st && st.page) await ensurePage(st.page);
  }
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", h.startsWith(a.dataset.r)));
  let html;
  if (parts[0] === "page") html = pageView(decodeURIComponent(parts[1]));
  else if (parts[0] === "cat") html = catView(parts[1]);
  else if (parts[0] === "log") html = logView();
  else if (parts[0] === "about") html = aboutView();
  else if (parts[0] === "chains") html = chainsView();
  else if (parts[0] === "chain") html = chainView(decodeURIComponent(parts[1]), parseInt(parts[2] || "0", 10));
  else html = indexView();
  $("#main").innerHTML = html;
  if (!parts[0].startsWith("chain")) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
$("#q").addEventListener("input", e => side(e.target.value));
document.querySelectorAll("#tabs a").forEach(a => a.addEventListener("click", () => location.hash = a.dataset.r));
load();
</script>
</body>
</html>
