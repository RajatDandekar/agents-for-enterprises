code: INV-STK-02
title: STOCK STATUS ENQUIRY
menu: Inventory > Stock status
roles: [ALL]
help: Stock for one item in one warehouse. Cover (days) = (on hand - allocated) / average daily issue.
fields:
  - {name: itm_cd, label: ITEM CD, type: str, req: true, lookup: itm_search}
  - {name: whs_cd, label: WHS CD, type: str, req: true, lookup: whs_list, default: WH-PUN-STR}
  - {name: on_hand, label: ON HAND, type: int, readonly: true}
  - {name: allocated, label: ALLOCATED, type: int, readonly: true}
  - {name: on_order, label: ON ORDER, type: int, readonly: true}
  - {name: avg_daily_issue, label: AVG DAILY ISSUE, type: int, readonly: true}
  - {name: reorder_lvl, label: REORDER LVL, type: int, readonly: true}
  - {name: cover_days, label: COVER (DAYS), type: int, readonly: true}
tasks:
  - button: Query
    service: stk_query
    sends: [itm_cd, whs_cd]
    fills: [on_hand, allocated, on_order, avg_daily_issue, reorder_lvl, cover_days]
  - {button: Close, service: null}
state:
  - {rule: "No stock row for the item and warehouse", error: ERR-STK-0001}
