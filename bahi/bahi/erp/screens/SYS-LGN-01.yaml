# Bahi ERP 7.2 screen file, in the course format (modules/README.md). Extra keys the legacy client reads:
# help (screen F1 text), lookup (the F2 list service), default (pre-filled value), columns/pick (result grids).
code: SYS-LGN-01
title: SIGN IN
menu: File > Sign in
roles: [ALL]
help: >-
  Enter your user ID and password. The organisation unit is your plant (RSW-PUN-01 for Pune).
  Three wrong passwords lock the account; call IT on extension 2210.
fields:
  - {name: user_id, label: USER ID, type: str, req: true}
  - {name: password, label: PASSWORD, type: str, req: true, help: shown as dots}
  - {name: ou_cd, label: ORG UNIT, type: str, req: true, default: RSW-PUN-01}
tasks:
  - button: Sign in
    service: login            # POST /login, not a /svc service; the client then loads the user's profile (usr_get)
    sends: [user_id, password, ou_cd]
    fills: [role_cd, name]
  - {button: Cancel, service: null}
state:
  - {rule: "User not mapped to the organisation unit typed", error: ERR-SEC-0007}
  - {rule: "Every sign-in is recorded in the live run as usr_get under SYS-LGN-01", error: null}
