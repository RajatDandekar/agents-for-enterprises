# What runs, pinned. Checked by `python -m deploy.versions --check` at image build time and in /version.
# Rule: change a prompt, a tool's schema or the workflow -> bump its version, paste the new sha
# (`python -m deploy.versions --print`), and pass the Lecture 6 regression gate before it leaves dev.

app_version: 0.7.0

environments:
  dev:
    model: gemini:gemini-3.8-flash        # the default tier
    stage: full                           # dev writes to its own sandbox freely
    temporal: time_skipping               # test server, days pass in seconds
  staging:
    model: gemini:gemini-3.8-flash
    stage: assist                         # a person's Confirm click is the only thing that writes
    temporal: connect                     # TEMPORAL_ADDRESS / TEMPORAL_NAMESPACE=bahi-staging
  prod:
    model: gemini:gemini-3.8-flash        # pinned exact id, never an alias like "latest"
    stage: shadow                         # starts at the bottom of the ladder; see rollout.yaml
    temporal: connect                     # TEMPORAL_NAMESPACE=bahi-prod

prompts:
  toolloop_system: {version: 3, sha: 1788c5267119}
  naive_system:    {version: 1, sha: ecd560e5cb55}

tools:                                    # schema hashes: name, description, parameters
  find_item:              {version: 1, sha: e7e31310132d}
  stock_position:         {version: 1, sha: 38af2fd28287}
  last_purchase:          {version: 1, sha: 19e4fec51df1}
  find_supplier:          {version: 1, sha: bb0c98be7d0a}
  check_cost_centre:      {version: 1, sha: eb15028837fd}
  create_purchase_order:  {version: 2, sha: 9b0950b31d02}
  release_purchase_order: {version: 1, sha: 6b3f601b1be1}
  order_status:           {version: 1, sha: 5063d7cbf708}

workflow:                                 # Temporal replays running workflows through this code: see runbook "Rolling back"
  PurchaseOrder: {version: 2, sha: 9bd7d5546cb4, task_queue: bahi-purchasing}

activities:
  bahi: {version: 1, sha: 77c715514cc0}
