code: PUR-POA-04
title: PURCHASE ORDER APPROVAL
menu: Purchase > Order approval
roles: [PUR-SR, PUR-MGR, PLANT-HEAD, SYS-ADMIN]
help: >-
  Inbox lists orders waiting for you. Fetch an order, then Approve, or Reject with a comment.
  Limits apply to the gross value including VAT.
fields:
  - {name: rows, label: INBOX, type: grid, readonly: true, columns: [doc_type, doc_no, requested_by, requested_on], pick: {doc_no: po_no}}
  - {name: po_no, label: PO NO, type: str, req: true, lookup: po_pending_appr}
  - {name: sup_cd, label: SUP CD, type: str, readonly: true}
  - {name: created_by, label: RAISED BY, type: str, readonly: true}
  - {name: gross_value, label: GROSS VALUE, type: float, readonly: true}
  - {name: status, label: STATUS, type: str, readonly: true}
  - {name: comment, label: COMMENT, type: str, req: false}
tasks:
  - {button: Inbox, service: po_pending_appr, sends: [], fills: [rows]}
  - {button: Fetch, service: po_get, sends: [po_no], fills: [sup_cd, created_by, gross_value, status]}
  - {button: Approve, service: po_approve, sends: [po_no, comment], fills: [status], needs: [Fetch]}
  - {button: Reject, service: po_reject, sends: [po_no, comment], fills: [status], needs: [Fetch]}
  - {button: Close, service: null}
state:
  - {rule: "Only orders in PA can be approved", error: ERR-PO-0702}
  - {rule: "Nobody approves their own order", error: ERR-APR-0003}
