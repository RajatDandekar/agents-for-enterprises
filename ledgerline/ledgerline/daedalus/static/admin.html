<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daedalus · operator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..700&family=Google+Sans+Code:wght@300..700&display=swap">
<link rel="stylesheet" href="/sky/sky.css">
<link rel="stylesheet" href="/static/daedalus.css">
</head>
<body>
<main class="wrap" style="padding:50px 24px">
  <h2>Daedalus · operator</h2>
  <form class="row" id="tok"><input class="big" id="t" type="password" placeholder="Admin token" style="max-width:420px"><button class="btn sky">Open</button></form>
  <div id="panel" class="hide">
    <div class="row">
      <button class="btn ember sm" data-f='{"enabled":false}'>Pause the model</button>
      <button class="btn sm" data-f='{"enabled":true,"reason":""}'>Resume</button>
      <button class="btn ghost sm" id="warm">Warm (keep 1 container)</button>
      <button class="btn ghost sm" id="cool">Cool</button>
    </div>
    <div class="row"><span class="lbl">Class cap US$/day</span><input class="big" id="cap" style="max-width:120px"><span class="lbl">Per student</span><input class="big" id="scap" style="max-width:120px"><button class="btn ghost sm" id="savecap">Save caps</button>
      <button class="btn ghost sm" id="purgetests">Remove test workshops</button><button class="btn ember sm" id="purgeall">Remove ALL workshops</button></div>
    <pre class="json" id="st" style="margin-top:20px;background:var(--card);padding:16px;border-radius:16px"></pre>
  </div>
</main>
<script>
let T = '';
const call = async (p, b) => { const r = await fetch(p, { method: b ? 'POST' : 'GET', headers: { 'X-Admin-Token': T, 'Content-Type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }); if (!r.ok) throw new Error(r.status); return r.json(); };
async function refresh() { const s = await call('/api/admin/status'); document.getElementById('st').textContent = JSON.stringify(s, null, 1); document.getElementById('cap').value = s.flags.cap_usd; document.getElementById('scap').value = s.flags.student_cap_usd; }
document.getElementById('tok').addEventListener('submit', async (e) => { e.preventDefault(); T = document.getElementById('t').value; try { await refresh(); document.getElementById('panel').classList.remove('hide'); setInterval(refresh, 5000); } catch (x) { alert('Wrong token'); } });
document.querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', async () => { await call('/api/admin/flags', JSON.parse(b.dataset.f)); refresh(); }));
document.getElementById('savecap').addEventListener('click', async () => { await call('/api/admin/flags', { cap_usd: +document.getElementById('cap').value, student_cap_usd: +document.getElementById('scap').value }); refresh(); });
document.getElementById('warm').addEventListener('click', async () => { await call('/api/admin/warm', { n: 1 }); refresh(); });
document.getElementById('cool').addEventListener('click', async () => { await call('/api/admin/warm', { n: 0 }); refresh(); });
document.getElementById('purgetests').addEventListener('click', async () => { if (confirm('Remove Probe/Load/Test/Film workshops?')) { await call('/api/admin/purge', { prefixes: ['Probe ', 'Load ', 'Test ', 'Film ', 'Shot '] }); refresh(); } });
document.getElementById('purgeall').addEventListener('click', async () => { if (confirm('Remove EVERY workshop?')) { await call('/api/admin/purge', { all: true }); refresh(); } });
</script>
</body>
</html>
