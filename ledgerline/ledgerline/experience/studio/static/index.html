<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow Studio · Northbridge Cycles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..700&family=Google+Sans+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/studio/static/studio.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/studio" title="Workflow Studio">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7db8ff"/><stop offset="1" stop-color="#0b57d0"/></linearGradient></defs>
      <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#bg)"/>
      <path d="M9 11.5h5.5c2 0 3 1 3 3v3c0 2 1 3 3 3H23" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="9" cy="11.5" r="2.6" fill="#fff"/><circle cx="23" cy="20.5" r="2.6" fill="#fff"/>
    </svg>
    <span class="bt"><b>Workflow Studio</b><small>Northbridge Cycles</small></span>
  </a>
  <div class="wfsel">
    <button class="pill ghost" id="wfMenuBtn" title="My workflows"><span id="wfIcon"></span>
      <input id="wfName" spellcheck="false" value="" aria-label="Workflow name">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <div class="menu" id="wfMenu"></div>
  </div>
  <span class="savestate" id="saveState"></span>
  <span class="problems" id="problems" hidden></span>
  <div class="grow"></div>
  <span class="who" id="who"></span>
  <button class="pill ghost" id="btnTemplates"><svg viewBox="0 0 16 16" width="15" height="15"><rect x="2" y="2" width="5" height="5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2" width="5" height="5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="9" width="5" height="5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="5" height="5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>Templates</button>
  <button class="pill ghost" id="btnRuns"><svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.6V8l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Runs</button>
  <button class="pill ghost" id="btnSave">Save</button>
  <button class="pill primary" id="btnRun"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"/></svg><span>Run</span></button>
</header>

<aside class="palette" id="palette">
  <div class="search"><svg viewBox="0 0 16 16" width="15" height="15"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input id="paletteSearch" placeholder="Search nodes and tools" spellcheck="false"></div>
  <div class="pgroups" id="paletteGroups"></div>
  <div class="phint">Drag a node onto the canvas, or click it to add.</div>
</aside>

<main class="canvas" id="canvas">
  <div class="world" id="world">
    <svg class="edges" id="edges" width="1" height="1"><defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5 1 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs><g id="edgeLayer"></g><path id="tempEdge" class="edge temp" d=""/></svg>
    <div class="nodes" id="nodes"></div>
  </div>
  <div class="runbar" id="runbar" hidden></div>
  <div class="zoom">
    <button id="zoomIn" title="Zoom in">+</button><button id="zoomOut" title="Zoom out">−</button><button id="zoomFit" title="Fit to view"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button><span id="zoomPct">100%</span>
  </div>
  <div class="empty" id="empty" hidden>
    <h2>Start a workflow</h2>
    <p>Drag a trigger and a few tools from the left, join them, and press Run. Or begin from a template.</p>
    <button class="pill primary" id="emptyTemplates">Browse templates</button>
  </div>
</main>

<aside class="inspector" id="inspector" hidden>
  <div class="itabs" id="itabs"></div>
  <div class="ibody" id="ibody"></div>
</aside>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet"></div></div>
<div class="toasts" id="toasts"></div>
<div class="ghost-node" id="ghost" hidden></div>
<div class="picker" id="picker" hidden></div>
<script src="/studio/static/app.js"></script>
</body>
</html>
