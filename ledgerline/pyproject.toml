[project]
name = "ledgerline-erp"
version = "0.1.0"
description = "Ledgerline ERP sandbox and reference agent for Vizuara's Agentic Systems Engineering course (all data fictional)"
requires-python = ">=3.10"
dependencies = ["openai>=1.50", "pyyaml", "pandas", "httpx", "pydantic>=2"]

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]
retrieval = ["rank_bm25", "numpy", "fastembed"]
graph = ["langgraph>=0.2", "langchain-core"]
mcp = ["fastmcp>=2.10", "mcp"]
durable = ["temporalio"]
evals = ["langfuse", "matplotlib"]
all = ["ledgerline-erp[server,retrieval,graph,mcp,durable,evals]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledgerline*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md", "*.jsonl", "*.html", "*.json", "*.js", "*.css", "*.svg"]
